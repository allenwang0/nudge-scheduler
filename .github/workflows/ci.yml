name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - run: swift --version
      - name: Format lint
        run: swift format lint --strict -r Sources Tests Package.swift
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build for iOS
        run: swift build --product NudgeScheduler --triple arm64-apple-ios16.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
      - name: Simulation report
        run: swift run -c release nudge-sim --seed 42 --out "$RUNNER_TEMP/site"
      - name: Committed results match a fresh run
        run: cmp site/results.json "$RUNNER_TEMP/site/results.json"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: ${{ runner.temp }}/site
