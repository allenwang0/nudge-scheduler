name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - run: swift --version
      - name: Format lint
        run: swift format lint --strict -r Sources Tests Package.swift
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build for iOS
        run: swift build --product NudgeScheduler --triple arm64-apple-ios16.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
      - name: Simulation report
        run: swift run -c release nudge-sim --seed 42 --out "$RUNNER_TEMP/site"
      - name: Committed results match a fresh run
        run: cmp site/results.json "$RUNNER_TEMP/site/results.json"
      - uses: actions/upload-artifact@v4
        with:
          name: simulation
          path: ${{ runner.temp }}/site

  report:
    # Pages publishes site/ as committed: the report built from the committed
    # site/results.json, which the test job checks against a fresh simulation.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build_report.py links results to the commit that last changed them
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report kit matches its pinned hashes
        run: python report-kit/check_kit.py
      - name: Committed report and README block are current
        run: |
          python scripts/build_report.py --readme README.md
          git diff --exit-code -- site README.md
      - name: Report numbers match results.json
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, report]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
